# Applies corrections submitted from the app ("Correct this" → "Save & submit to GitHub").
# Issues opened by the repository owner/members/collaborators are applied immediately;
# anyone else's are applied when a maintainer adds the "approved" label.
name: Apply corrections

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: corrections
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      contains(github.event.issue.body, '<!-- tamil-song-finder-correction -->') &&
      github.event.issue.state == 'open' &&
      ((github.event.action == 'opened' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
       (github.event.action == 'labeled' && github.event.label.name == 'approved'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply
        id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/issue.md"
          set +e
          node scripts/apply-correction.mjs "$RUNNER_TEMP/issue.md" > "$RUNNER_TEMP/summary.md"
          echo "ok=$([ $? -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/summary.md"
      - name: Commit
        if: steps.apply.outputs.ok == 'true'
        env:
          NUMBER: ${{ github.event.issue.number }}
        run: |
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/corrections.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply correction from #$NUMBER"
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push && exit 0
            sleep 5
          done
          exit 1
      - name: Report on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          OK: ${{ steps.apply.outputs.ok }}
        run: |
          {
            cat "$RUNNER_TEMP/summary.md" 2>/dev/null || echo "The workflow failed before applying anything."
            echo
            if [ "$OK" = "true" ]; then echo "The site redeploys with this change in a minute or two."; else echo "Edit the issue's json block to fix this, then remove and re-add the \`approved\` label (or open a new issue)."; fi
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          if [ "$OK" = "true" ]; then gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed; fi
